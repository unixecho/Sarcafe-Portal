<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Sarcafe intro · design preview</title>
<!--
  SARCAFE INTRO — DESIGN PREVIEW (not part of the app; nothing here ships).

  Source template. `node docs/intro-preview/build.mjs` inlines the logo and the
  two backdrop images and writes sarcafe-intro-preview.html next to it.

  Two layers live in this file:
    1. The review shell (this page's own <style>/<script>): the controls, the
       device frame, the read-out. Throwaway.
    2. The frame template (<template id="frame-tpl">): a mock of the Sarcafe
       portal with the intro on top. Everything between the PORT markers is
       written to be moved into the app verbatim when the implementation is
       unblocked (see docs/SARCAFE_INTRO.md, "Port plan"):
         PORT config  -> src/lib/intro/config.ts
         PORT copy    -> src/lib/intro/copy.ts
         PORT css     -> src/components/intro/intro.css
         PORT runtime -> src/components/intro/Intro.tsx
-->
<style>
/* ===== the review shell (preview only) ===== */
:root{--ink:#0d0907;--panel:#1a110d;--line:rgba(253,246,236,.12);--text:#fdf6ec;--dim:#b9ada0;--accent:#ff7a45;--accent-soft:#ffab7a;--sage:#93a36f}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.title{display:flex;flex-direction:column;line-height:1.15;margin-inline-end:auto}
.title b{font-size:15px;letter-spacing:.01em}
.title span{font-size:11.5px;color:var(--dim)}
.group{display:flex;align-items:center;gap:6px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:#120b08}
.seg button{appearance:none;border:0;background:transparent;color:var(--dim);font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;cursor:pointer;min-height:32px}
.seg button[aria-checked="true"]{background:var(--accent);color:#1a0f09;font-weight:700}
.seg button:focus-visible,.replay:focus-visible{outline:2px solid var(--accent-soft);outline-offset:2px}
.replay{appearance:none;border:1px solid var(--accent);background:transparent;color:var(--accent-soft);font:inherit;font-weight:700;padding:7px 16px;border-radius:999px;cursor:pointer;min-height:36px}
.replay:hover{background:rgba(255,122,69,.14)}
.stage{flex:1;min-height:0;display:grid;place-items:center;padding:16px;position:relative}
.device{position:relative;background:#000;border-radius:44px;padding:10px;box-shadow:0 0 0 2px #2b211c,0 30px 90px rgba(0,0,0,.65)}
.device[data-d="desktop"]{border-radius:14px;padding:0}
.device[data-d="landscape"]{border-radius:40px}
.device[data-d="fill"]{border-radius:0;padding:0;box-shadow:none}
.screen{position:relative;overflow:hidden;border-radius:34px;background:#150f0c}
.device[data-d="desktop"] .screen{border-radius:14px}
.device[data-d="fill"] .screen{border-radius:0}
.screen iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#150f0c}
.readout{padding:10px 16px 14px;background:var(--panel);border-top:1px solid var(--line);color:var(--dim);font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.readout b{color:var(--text)}
.ok{color:var(--sage)}.bad{color:#ff6b6b}
/* On a phone the read-out wraps to several lines; reserve them up front so the
   frame is never sized against a one-line footer and then overlapped by it. */
@media (max-width:640px){.bar{gap:8px 12px;padding:10px 12px}.lbl{display:none}.title span{display:none}.seg button{padding:6px 10px;font-size:12.5px}.stage{padding:0}.readout{font-size:11.5px;padding:8px 12px 12px;min-height:82px;align-content:flex-start}}
</style>
</head>
<body>

<header class="bar">
  <div class="title"><b>sārcāfe · intro</b><span>Design preview. Not in the app yet.</span></div>
  <div class="group"><span class="lbl">Version</span><div class="seg" id="g-variant" role="radiogroup" aria-label="Version"></div></div>
  <div class="group"><span class="lbl">Language</span><div class="seg" id="g-lang" role="radiogroup" aria-label="Language"></div></div>
  <div class="group"><span class="lbl">Copy</span><div class="seg" id="g-copy" role="radiogroup" aria-label="Copy option"></div></div>
  <div class="group"><span class="lbl">Device</span><div class="seg" id="g-device" role="radiogroup" aria-label="Device"></div></div>
  <div class="group"><span class="lbl">Motion</span><div class="seg" id="g-motion" role="radiogroup" aria-label="Motion preference"></div></div>
  <button class="replay" id="replay" type="button" title="Replay (R)">▶ Replay</button>
</header>

<main class="stage" id="stage">
  <div class="device" id="device" data-d="phone">
    <div class="screen" id="screen"><iframe id="frame" title="Sarcafe intro preview"></iframe></div>
  </div>
</main>

<footer class="readout" id="readout" aria-live="polite">Loading…</footer>

<!-- =====================================================================
     THE FRAME: a mock of the portal (the page the intro lifts off of) with
     the intro on top. Loaded into the iframe via srcdoc, rebuilt on every
     change of control.
     ===================================================================== -->
<template id="frame-tpl">
<style>
/* ----- tokens + base: a subset of src/app/globals.css, same values ----- */
:root{
  --bg:#150f0c;--bg-elev:#221712;--bg-elev-2:#2e1f18;
  --neon:#ff7a45;--neon-soft:#ffab7a;--sage:#93a36f;
  --text:#fdf6ec;--text-dim:#b9ada0;--text-faint:#9c9086;
  --line:rgba(253,246,236,.08);--line-strong:rgba(253,246,236,.14);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Rubik',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{font-variant-numeric:tabular-nums}

/* ----- the mock portal behind the intro (mirrors src/app/page.tsx's hero) ----- */
#main{min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 24px);text-align:center;position:relative;outline:none}
.hero{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;min-height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 44px)}
.panel{width:100%;max-width:360px}
.logo-badge{width:92px;height:92px;border-radius:50%;background:#fdf6ec;display:grid;place-items:center;box-shadow:0 10px 24px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.04)}
.logo-badge img{width:86px;height:86px;object-fit:contain;display:block}
.eyebrow{margin:0;color:var(--neon-soft);font-size:.8rem;font-weight:700}
h1{margin:4px 0 6px;font-size:1.8rem;font-weight:800}
.sub{margin:0 0 20px;color:var(--text-dim);font-size:.9rem}
.branches{display:flex;flex-direction:column;gap:10px}
.branch{min-height:64px;width:100%;border-radius:15px;border:1px solid var(--line);background:var(--bg-elev);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px;font:inherit;cursor:pointer}
.branch b{font-weight:700;font-size:1.05rem}
.branch small{color:var(--text-faint);font-size:.72rem}
@keyframes rise-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rise{animation:rise-in .55s var(--ease) backwards}
.portal-hero-mark{animation:rise-in .6s var(--ease) .1s backwards;background:none;border:0;padding:0}
@media (prefers-reduced-motion: reduce){.rise,.portal-hero-mark{animation:none}}

/* ===== >>> PORT css -> src/components/intro/intro.css ===================== */
/* The intro: a dark screen, the badge lighting up like a café lamp, two lines
   arriving word by word, then the page. Same mechanics as Ayeka.Bar's intro
   (BLUEPRINT §4.15); the look is Sarcafe's own — warm amber on espresso, with
   the cart's string lights and steam in the welcome.

   NO TIMING LIVES HERE. Every duration/delay is an --intro-* custom property
   written onto .intro from config.ts (introCssVars()). The three per-element
   values (--x/--y/--at, --h/--v) belong to their own elements.

   Motion laws kept (BLUEPRINT §4.14): the overlay lives in the ROOT LAYOUT, not
   under #a11y-scope or template.tsx (a); no backdrop-filter, ever (b); the
   three state attributes are only ever ADDED (c); nothing positioned with
   `transform` is also animated with it — the coin, halo, lights, steam and copy
   are placed with left/top and their animated transforms live on children (d). */

.intro{
  --coin:min(54vw,34vh,224px);
  --coin-y:38%;
  --copy-w:min(92vw,560px);
  /* Follows the SHORTER dimension as well as the width, so a landscape phone
     (wide, short) does not get bulbs sized for a monitor. */
  --bulb-size:clamp(6px,min(1.9vw,1.5vh),11px);
  position:fixed;inset:0;
  /* One notch UNDER the accessibility widget (a11y-widget: 2147483000). */
  z-index:2147482000;
  overflow:hidden;
  color:var(--text);
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  /* Two light sources, as on Ayeka's — but warm amber top-right and a breath of
     the logo's sage top-left, where Ayeka has coral and cyan. */
  background:
    radial-gradient(130% 100% at 50% 44%,transparent 50%,rgba(0,0,0,.5) 100%),
    radial-gradient(70% 55% at 78% -8%,rgba(255,122,69,.11),transparent 60%),
    radial-gradient(55% 45% at 12% -4%,rgba(147,163,111,.07),transparent 60%),
    var(--bg);
  /* The failsafe: if script never takes over, CSS removes the overlay itself.
     The component disarms it (data-armed) the moment it mounts. */
  animation:intro-failsafe 1ms linear var(--intro-failsafe) forwards;
}
@supports (height:1dvh){.intro{--coin:min(54vw,34dvh,224px);--bulb-size:clamp(6px,min(1.9vw,1.5dvh),11px)}}
.intro[data-armed]{animation:none}
/* Order matters: these two come after [data-armed] and win on source order. */
.intro[data-out]{animation:intro-out var(--intro-exit) var(--ease) var(--intro-exit-delay) both}
.intro[data-skip]{animation:intro-out var(--intro-skip) ease-out both}
/* Once the dissolve is far enough along to see through, stop catching taps. */
.intro[data-pass]{pointer-events:none}
@keyframes intro-failsafe{to{visibility:hidden}}
@keyframes intro-out{to{opacity:0;visibility:hidden}}
html.intro-lock{overflow:hidden;scrollbar-gutter:stable}

/* ---- the stage: everything that leaves together ---- */
.intro-stage{position:absolute;inset:0;transform-origin:50% var(--coin-y)}
.intro[data-out] .intro-stage{animation:intro-stage-out var(--intro-stage-exit) var(--ease) both}
.intro[data-skip] .intro-stage{animation:intro-stage-out var(--intro-skip) ease-out both}
@keyframes intro-stage-out{to{opacity:0;transform:translateY(-14px) scale(1.045)}}

/* ---- the halo: the lamp's warm light on the room ----
   A dimmer rising, not a neon striking: ONE monotonic ease from a pilot light to
   full, no reversals. (Ayeka's halo flickers on; a coffee cart's lamp warms.) */
.intro-halo{
  position:absolute;
  left:calc(50% - var(--coin) * 1.5);
  top:calc(var(--coin-y) - var(--coin) * 1.5);
  width:calc(var(--coin) * 3);height:calc(var(--coin) * 3);
  border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,158,84,.34),rgba(255,122,69,.12) 52%,transparent 100%);
  opacity:.12;
  pointer-events:none;
}
.intro[data-lit] .intro-halo{animation:intro-halo-on var(--intro-lit) cubic-bezier(.3,0,.2,1) both}
@keyframes intro-halo-on{from{opacity:.12}to{opacity:.95}}

/* ---- the coin: Sarcafe's cream badge (the same disc LogoMark draws) ---- */
.intro-coin{
  position:absolute;
  left:calc(50% - var(--coin) / 2);
  top:calc(var(--coin-y) - var(--coin) / 2);
  width:var(--coin);height:var(--coin);
}
.intro-badge{
  position:absolute;inset:0;border-radius:50%;overflow:hidden;
  background:#fdf6ec;
  /* Standby: a lamp that is off — dim, so the first frame is already "this is
     Sarcafe" and the moment it lights is a gesture, not an arrival. */
  opacity:.3;
  filter:brightness(.6) saturate(.85) drop-shadow(0 0 0 rgba(255,150,80,0));
}
.intro-badge img{position:absolute;inset:3%;width:94%;height:94%;object-fit:contain;display:block}
.intro[data-lit] .intro-badge{animation:intro-badge-on var(--intro-lit) cubic-bezier(.2,.8,.2,1) both}
@keyframes intro-badge-on{
  0%{opacity:.3;transform:scale(.955);filter:brightness(.6) saturate(.85) drop-shadow(0 0 0 rgba(255,150,80,0))}
  100%{opacity:1;transform:none;filter:brightness(1) saturate(1) drop-shadow(0 0 24px rgba(255,150,80,.45))}
}

/* Light moving across the glaze. On a CREAM disc a pale band would be
   invisible, so the sheen is amber — candlelight sliding over a cup, not a
   glint on chrome. Always physically left→right: light does not mirror. */
.intro-glint{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.intro-glint::before{
  content:'';position:absolute;top:-12%;bottom:-12%;left:0;width:38%;
  background:linear-gradient(100deg,rgba(255,150,70,0) 0%,rgba(255,150,70,.42) 50%,rgba(255,150,70,0) 100%);
  transform:translateX(-130%) skewX(-18deg);opacity:0;
}
.intro[data-lit] .intro-glint::before{animation:intro-glint var(--intro-glint) cubic-bezier(.45,0,.2,1) var(--intro-glint-at) both}
@keyframes intro-glint{
  0%{opacity:0;transform:translateX(-130%) skewX(-18deg)}
  15%{opacity:1}85%{opacity:1}
  100%{opacity:0;transform:translateX(340%) skewX(-18deg)}
}

/* ============================================================
   THE WELCOME — a device's first visit. The two things only this version has
   (rendered only when data-variant="first", so a repeat visitor never sees an
   unlit string flash in standby):
   • the cart's STRING LIGHTS — a wire of ten bulbs that catch one after another,
     the way they do in the illustration the portal sits on;
   • STEAM — three wisps rising from behind the badge.
   Both finish before the exit starts (the harness holds them to it).
   ============================================================ */
.intro-lights{
  position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 6px);
  height:min(15vh,132px);pointer-events:none;opacity:0;
}
@supports (height:1dvh){.intro-lights{height:min(15dvh,132px)}}
.intro[data-lit] .intro-lights{animation:intro-fade-in var(--intro-lights) ease-out var(--intro-lights-at) both}
.intro-wire{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.intro-wire path{fill:none;stroke:rgba(253,246,236,.2);stroke-width:1.2;vector-effect:non-scaling-stroke}
/* Each bulb is an anchor on the wire: a stem, a glass, and a soft glow. Placed
   with left/top; only the glass colour and the glow animate. */
.intro-bulb{position:absolute;left:calc(var(--x) * 100%);top:calc(var(--y) * 100%);width:0;height:0}
.intro-bulb::before{content:'';position:absolute;left:-.5px;top:0;width:1px;height:calc(var(--bulb-size) * .7);background:rgba(253,246,236,.2)}
.intro-bulb::after{
  content:'';position:absolute;
  left:calc(var(--bulb-size) / -2);top:calc(var(--bulb-size) * .6);
  width:var(--bulb-size);height:calc(var(--bulb-size) * 1.25);
  border-radius:50% 50% 50% 50% / 38% 38% 62% 62%;
  background-color:#5c4434;
}
.intro-bulb b{
  position:absolute;
  left:calc(var(--bulb-size) * -3.5);top:calc(var(--bulb-size) * -1.5);
  width:calc(var(--bulb-size) * 7);height:calc(var(--bulb-size) * 7);
  border-radius:50%;opacity:0;
  background:radial-gradient(closest-side,rgba(255,196,118,.5),rgba(255,160,80,.16) 55%,transparent 100%);
}
.intro[data-lit] .intro-bulb::after{animation:intro-bulb-glass var(--intro-bulb) ease-out var(--at) both}
.intro[data-lit] .intro-bulb b{animation:intro-bulb-glow var(--intro-bulb) ease-out var(--at) both}
@keyframes intro-bulb-glass{
  from{background-color:#5c4434;box-shadow:0 0 0 0 rgba(255,196,118,0)}
  to{background-color:#ffdca6;box-shadow:0 0 calc(var(--bulb-size) * .9) calc(var(--bulb-size) * .12) rgba(255,196,118,.85)}
}
@keyframes intro-bulb-glow{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}

.intro-steam{
  position:absolute;
  left:calc(50% - var(--coin) / 2);
  top:calc(var(--coin-y) - var(--coin) / 2 - var(--coin) * .62);
  width:var(--coin);height:calc(var(--coin) * .7);
  pointer-events:none;
}
.intro-wisp{
  position:absolute;bottom:0;
  left:calc(50% + var(--x) * var(--coin) - var(--coin) * .09);
  width:calc(var(--coin) * .18);height:calc(var(--coin) * var(--h));
  overflow:visible;opacity:0;transform-origin:50% 100%;
  -webkit-mask-image:linear-gradient(to top,#000 0%,#000 22%,transparent 100%);
          mask-image:linear-gradient(to top,#000 0%,#000 22%,transparent 100%);
  filter:blur(.7px);
}
.intro-wisp path{fill:none;stroke:rgba(253,246,236,.66);stroke-width:3.4px;stroke-linecap:round;vector-effect:non-scaling-stroke}
.intro[data-lit] .intro-wisp{animation:intro-wisp calc(var(--intro-steam) * var(--v)) ease-in-out var(--at) both}
@keyframes intro-wisp{
  0%{opacity:0;transform:translateY(16%) scaleY(.72) translateX(0)}
  28%{opacity:.9}
  100%{opacity:0;transform:translateY(-16%) scaleY(1.04) translateX(3%)}
}
/* A landscape phone has no room above the badge for steam. */
@media (max-height:520px){.intro-steam{display:none}}

/* ---- the words ---- */
.intro-copy{
  position:absolute;
  left:calc(50% - var(--copy-w) / 2);width:var(--copy-w);
  top:calc(var(--coin-y) + var(--coin) / 2 + clamp(16px,3.2vh,28px));
  padding:0 8px;text-align:center;
}
@supports (height:1dvh){.intro-copy{top:calc(var(--coin-y) + var(--coin) / 2 + clamp(16px,3.2dvh,28px))}}
.intro-rule{
  display:block;width:46px;height:2px;margin:0 auto 14px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--neon-soft),transparent);
  box-shadow:0 0 12px rgba(255,150,80,.55);
  transform:scaleX(0);opacity:0;
}
.intro[data-lit] .intro-rule{animation:intro-rule var(--intro-rule) var(--ease) var(--intro-rule-at) both}
@keyframes intro-rule{to{transform:scaleX(1);opacity:1}}
.intro-line{margin:0;text-wrap:balance}
.intro-l1{font-weight:800;line-height:1.22;color:var(--text);font-size:clamp(1.05rem,min(6.2vw,5.2vh),2.15rem);text-shadow:0 0 28px rgba(255,150,80,.22)}
.intro-l2{margin-top:12px;font-weight:400;line-height:1.5;color:var(--text-dim);font-size:clamp(.85rem,min(3.9vw,3.6vh),1.2rem)}
@supports (height:1dvh){
  .intro-l1{font-size:clamp(1.05rem,min(6.2vw,5.2dvh),2.15rem)}
  .intro-l2{font-size:clamp(.85rem,min(3.9vw,3.6dvh),1.2rem)}
}
/* A real monitor. Gated on BOTH dimensions so a short landscape phone never
   lands here. */
@media (min-width:1024px) and (min-height:640px){
  .intro{--coin:min(26vw,40vh,300px);--copy-w:min(90vw,760px)}
  .intro-l1{font-size:clamp(2rem,3.1vw,2.9rem)}
  .intro-l2{font-size:clamp(1.1rem,1.55vw,1.45rem)}
  .intro-hint{font-size:.85rem}
}
/* Arabic is cursive: any letter-spacing breaks the joins. */
.intro-copy[lang="ar"] .intro-line{letter-spacing:0}
.intro-w{display:inline-block;opacity:0}
.intro[data-lit] .intro-l1 .intro-w{animation:intro-word var(--intro-w1) var(--ease) both;animation-delay:calc(var(--intro-l1-at) + var(--i) * var(--intro-l1-step))}
.intro[data-lit] .intro-l2 .intro-w{animation:intro-word var(--intro-w2) var(--ease) both;animation-delay:calc(var(--intro-l2-at) + var(--i) * var(--intro-l2-step))}
@keyframes intro-word{from{opacity:0;transform:translateY(.5em);filter:blur(7px)}to{opacity:1;transform:none;filter:none}}
/* The one word that carries the headline: amber lamp-light, softer than a neon. */
.intro-w.hl{color:var(--neon-soft);text-shadow:0 0 22px rgba(255,122,69,.55),0 0 4px rgba(255,171,122,.6)}
.intro-hint{position:absolute;left:0;right:0;margin:0;bottom:calc(env(safe-area-inset-bottom) + 20px);text-align:center;font-size:.78rem;letter-spacing:.03em;color:var(--text-faint);opacity:0}
.intro-hint[lang="ar"]{letter-spacing:0}
.intro[data-lit] .intro-hint{animation:intro-hint var(--intro-hint) ease var(--intro-hint-at) both}
@keyframes intro-hint{to{opacity:.85}}
@keyframes intro-fade-in{from{opacity:0}to{opacity:1}}

/* ============================================================
   Reduced motion — SUBSTITUTE, don't remove (BLUEPRINT §4.13). Still plays, as
   fades: no scale, blur, travel, glint, steam or ignition sequence, and the
   words arrive a line at a time. The string lights simply fade up already lit.
   ============================================================ */
@media (prefers-reduced-motion: reduce){
  .intro-glint,.intro-steam{display:none}
  .intro[data-lit] .intro-badge{animation-name:intro-badge-calm}
  @keyframes intro-badge-calm{
    from{opacity:.3;filter:brightness(.6) saturate(.85) drop-shadow(0 0 0 rgba(255,150,80,0))}
    to{opacity:1;filter:brightness(1) saturate(1) drop-shadow(0 0 24px rgba(255,150,80,.45))}
  }
  .intro[data-lit] .intro-halo{animation-timing-function:ease-out}
  .intro[data-lit] .intro-rule{animation-name:intro-fade-in;transform:none}

var narrow = window.innerWidth <= 640
var state = { variant: 'first', lang: 'he', copy: 'A', device: narrow ? 'fill' : 'phone', motion: 'normal' }
// A state can be linked to: ?variant=first|repeat&lang=he|en|ar&copy=A|B|C&device=phone|landscape|desktop&motion=normal|reduced
// ?freeze=1900 additionally stops every animation at that millisecond of the show (for stills).
;(function () {
  var q = new URLSearchParams(location.search)
  GROUPS.forEach(function (g) {
    var v = q.get(g.key)
    if (v && g.opts.some(function (o) { return o[0] === v }) && !(g.key === 'device' && narrow)) state[g.key] = v
  })
  if (q.get('device') === 'fill') state.device = 'fill'   // unlisted: the frame takes the whole stage (a real-size look at any window)
})()
var freezeMs = Number(new URLSearchParams(location.search).get('freeze')) || 0
var runId = 0
var els = { frame: document.getElementById('frame'), device: document.getElementById('device'), screen: document.getElementById('screen'), stage: document.getElementById('stage'), readout: document.getElementById('readout'), tpl: document.getElementById('frame-tpl') }
var lastPlan = null

function buildGroups() {
  GROUPS.forEach(function (g) {
    if (g.key === 'device' && narrow) { document.getElementById('g-device').parentNode.style.display = 'none'; return }
    var host = document.getElementById('g-' + g.key)
    host.innerHTML = ''
    g.opts.forEach(function (o) {
      var b = document.createElement('button')
      b.type = 'button'; b.setAttribute('role', 'radio'); b.dataset.k = g.key; b.dataset.v = o[0]; b.textContent = o[1]
      if (o[2]) b.title = o[2]
      if (g.key === 'lang') b.lang = o[0]
      b.setAttribute('aria-checked', String(state[g.key] === o[0]))
      b.addEventListener('click', function () {
        state[g.key] = o[0]
        Array.prototype.forEach.call(host.children, function (c) { c.setAttribute('aria-checked', String(c.dataset.v === o[0])) })
        if (g.key === 'device') layout()
        play()
      })
      host.appendChild(b)
    })
  })
}

function srcdoc(cfg) {
  var dir = cfg.lang === 'en' ? 'ltr' : 'rtl'
  var body = els.tpl.innerHTML.split('__LOGO_SRC__').join(ASSETS.logo)
  // Emulate prefers-reduced-motion inside the frame: the real rules are written
  // as @media (prefers-reduced-motion: reduce), so the emulation just makes that
  // query unconditional.
  if (cfg.motion === 'reduced') body = body.split('@media (prefers-reduced-motion: reduce)').join('@media all')
  var grad = 'linear-gradient(180deg,rgba(21,15,12,.55) 0%,rgba(21,15,12,.72) 45%,#150f0c 92%),radial-gradient(circle at 50% 0%,rgba(21,15,12,.2),transparent 55%)'
  var backdrop = '<style>.public-backdrop{background-image:' + grad + ',url("' + ASSETS.bg + '");background-position:0 0,0 0,center 25%;background-size:auto,auto,cover;background-repeat:no-repeat;background-attachment:fixed,fixed,fixed;background-color:#150f0c}' +
    '@media (min-width:900px){.public-backdrop{background-image:' + grad + ',url("' + ASSETS.bgWide + '");background-position:0 0,0 0,center 40%}}</style>'
  var fonts = '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap">'
  return '<!doctype html><html lang="' + cfg.lang + '" dir="' + dir + '"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Sarcafe</title>' + fonts + backdrop + '</head><body><script>window.__INTRO_CFG__=' + JSON.stringify(cfg) + '<\/script>' + body + '</body></html>'
}

function layout() {
  var d = state.device
  var box = els.stage.getBoundingClientRect()
  var pad = d === 'fill' ? 0 : (d === 'desktop' ? 0 : 10)
  var availW = box.width - (d === 'fill' ? 0 : 32), availH = box.height - (d === 'fill' ? 0 : 32)
  var W, H, s
  if (d === 'fill') { W = Math.floor(availW); H = Math.floor(availH); s = 1 }
  else { W = SIZES[d][0]; H = SIZES[d][1]; s = Math.min(1, (availW - pad * 2) / W, (availH - pad * 2) / H) }
  els.device.dataset.d = d
  els.screen.style.width = Math.round(W * s) + 'px'
  els.screen.style.height = Math.round(H * s) + 'px'
  els.frame.style.width = W + 'px'
  els.frame.style.height = H + 'px'
  els.frame.style.transform = 'scale(' + s + ')'
}

function play() {
  runId++
  lastPlan = null
  els.readout.textContent = 'Playing…'
  var cfg = { runId: runId, variant: state.variant, lang: state.lang, copy: state.copy, motion: state.motion, ignoreHidden: true }
  els.frame.srcdoc = srcdoc(cfg)
}

function fmt(ms) { return (ms / 1000).toFixed(1) + ' s' }
window.addEventListener('message', function (e) {
  var m = e.data
  if (!m || m.source !== 'sarcafe-intro' || m.runId !== runId) return
  if (m.type === 'plan') {
    lastPlan = m
    if (freezeMs) window.setTimeout(function () { try { els.frame.contentWindow.__introQA.freeze(freezeMs) } catch (err) {} }, 30)
    var ok = m.plan.doneAtMs <= m.budget
    els.readout.innerHTML = '<b>' + (m.variant === 'first' ? 'Welcome' : 'Short') + '</b>' +
      '<span>plays about <b>' + fmt(m.plan.doneAtMs) + '</b> from the moment the lamp lights</span>' +
      '<span class="' + (ok ? 'ok' : 'bad') + '">' + (ok ? '✓ within' : '✗ over') + ' its ' + fmt(m.budget) + ' budget</span>' +
      (m.variant === 'first' ? '<span class="' + (m.extrasEnd <= m.plan.exitAtMs ? 'ok' : 'bad') + '">' + (m.extrasEnd <= m.plan.exitAtMs ? '✓ lights and steam finish before the exit' : '✗ extras run into the exit') + '</span>' : '') +
      '<span>tap, any key or scroll skips it</span>'
  } else if (m.type === 'done') {
    var base = els.readout.innerHTML
    if (lastPlan && base.indexOf('finished') === -1) els.readout.innerHTML = base + '<span>· finished. Press Replay or R to watch again</span>'
  }
})

document.getElementById('replay').addEventListener('click', play)
window.addEventListener('keydown', function (e) { if ((e.key === 'r' || e.key === 'R') && !e.ctrlKey && !e.metaKey && !e.altKey) play() })
var rz = 0
window.addEventListener('resize', function () { window.clearTimeout(rz); rz = window.setTimeout(layout, 60) })

buildGroups()
layout()
play()
</script>
</body>
</html>
